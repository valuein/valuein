version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Batch ALL github-actions bumps into a single monthly PR instead of one
    # PR per action (setup-uv v8 dropped floating major tags, so each pinned
    # action would otherwise generate its own PR on every release).
    groups:
      github-actions:
        patterns:
          - "*"
      # Security advisories ship as ONE PR (immediately, not on the monthly
      # cadence above). Security updates always target the default branch and
      # need repo settings "Dependabot alerts" + "Dependabot security updates".
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore
      include: scope
